apiVersion: apps/v1
kind: Deployment
metadata:
  name: etmsys-frontend
  namespace: etmsys

spec:
  replicas: 2

  selector:
    matchLabels:
      app: etmsys-frontend

  template:
    metadata:
      labels:
        app: etmsys-frontend

    spec:
      containers:
        - name: frontend
          image: piraidasan/etmsys-frontend:latest

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 20
            periodSeconds: 20
